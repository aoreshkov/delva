[versions]
kotlin = "2.4.21"
kotlinxCoroutines = "1.11.0"
kotlinxSerialization = "1.12.0"
kotlinxBenchmark = "0.5.0"
dokka = "2.2.0"
# The released cli-kit that delva-cli builds on and a Delva release ships; its own train's version is clikit.version.
cliKit = "0.3.0"
# The released Delva that delva-intellij-plugin bundles, and so the store formats it reads; its own train's version is
# delva.version.
delva = "0.3.0"
# delva-intellij-plugin builds against the lowest IDE it supports, never a newer one: 2026.2 is the first on Java 25,
# and Delva's JVM 22 classes can't load on the Java 21 runtime of older IDEs.
intellijIdea = "2026.2.3"
# The IntelliJ Platform's test framework runs on JUnit 4.
junit4 = "4.13.2"
changelog = "2.5.0"
# What Starter declares; the IntelliJ Platform Gradle Plugin leaves it out as the IDE's, but Starter's own JVM needs it.
teamcityServiceMessages = "2024.07"

[libraries]
cli-kit = { module = "app.oreshkov.clikit:cli-kit", version.ref = "cliKit" }
cli-kit-testing = { module = "app.oreshkov.clikit:cli-kit-testing", version.ref = "cliKit" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinxCoroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinxCoroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinxSerialization" }
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }
kotlin-test-junit5 = { module = "org.jetbrains.kotlin:kotlin-test-junit5", version.ref = "kotlin" }
# Version aligned through the JUnit BOM that kotlin-test-junit5 brings in; test runtime only.
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
delva = { module = "app.oreshkov.delva:delva", version.ref = "delva" }
junit4 = { module = "junit:junit", version.ref = "junit4" }
teamcity-serviceMessages = { module = "org.jetbrains.teamcity:serviceMessages", version.ref = "teamcityServiceMessages" }
kotlinx-benchmark-runtime = { module = "org.jetbrains.kotlinx:kotlinx-benchmark-runtime", version.ref = "kotlinxBenchmark" }

# Gradle plugins, put on the build-logic classpath so every module shares one Kotlin plugin instance.
# Apply them by id without a version.
kotlin-gradle-plugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
kotlin-allopen-gradle-plugin = { module = "org.jetbrains.kotlin:kotlin-allopen", version.ref = "kotlin" }
kotlin-serialization-gradle-plugin = { module = "org.jetbrains.kotlin:kotlin-serialization", version.ref = "kotlin" }
kotlinx-benchmark-gradle-plugin = { module = "org.jetbrains.kotlinx:kotlinx-benchmark-plugin", version.ref = "kotlinxBenchmark" }
dokka-gradle-plugin = { module = "org.jetbrains.dokka:dokka-gradle-plugin", version.ref = "dokka" }
changelog-gradle-plugin = { module = "org.jetbrains.intellij.plugins:gradle-changelog-plugin", version.ref = "changelog" }
