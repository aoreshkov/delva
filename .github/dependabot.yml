# Weekly updates, grouped so a week's worth arrives as one pull request per ecosystem. A version update waits out a
# cooldown after its release, so one that is pulled soon after it ships never arrives; security updates don't wait.
# Security updates are grouped too, apart from version updates: a group applies to one kind only, and without its
# own group each security update would arrive as a pull request of its own.
version: 2
updates:
  # The SHA pins in the workflows and the setup action, with their version comments.
  - package-ecosystem: github-actions
    directories: ["/", "/.github/actions/setup-build"]
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
      actions-security:
        applies-to: security-updates
        patterns: ["*"]

  # gradle/libs.versions.toml, the settings and build-logic plugins, and the Gradle wrapper.
  - package-ecosystem: gradle
    directories: ["/", "/build-logic"]
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
      semver-major-days: 14
      # Libraries released from this repository, such as cli-kit for delva-cli and Delva for the IntelliJ plugin, are
      # proposed as soon as they ship.
      exclude: ["app.oreshkov.*"]
    ignore:
      # The IntelliJ plugin's minor is that of the Delva it bundles, so a new Delva minor alone fails
      # checkPluginDistribution: it moves together with delvaTools.version, by hand. Patch releases still come.
      - dependency-name: "app.oreshkov.delva:delva"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
    groups:
      gradle:
        patterns: ["*"]
      gradle-security:
        applies-to: security-updates
        patterns: ["*"]
