name: Release

# A tag vX.Y.Z (the Delva release train) or cli-kit-vX.Y.Z (the cli-kit train) tests, signs, attests, uploads that
# train to the Central Portal and drafts its GitHub release; a tag delva-tools-vX.Y.Z does the same for the IntelliJ
# plugin, uploaded to JetBrains Marketplace. project/RELEASING.md has the setup they need and the manual steps after.

on:
  push:
    tags: ['v*', 'cli-kit-v*', 'delva-tools-v*']

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # No cache on the release path: a release is built from the tag alone, never from state a cache could carry in.
      - uses: ./.github/actions/setup-build
        with:
          cache-disabled: true

      # The cli-kit and Delva Tools trains run all of `check` too, so their releases come from a commit whose whole
      # build passes. delva-cli builds on the cli-kit pinned in the catalog, and the plugin on the Delva pinned there,
      # so neither meets unreleased code here. The engine's long suites touch neither cli-kit nor the plugin.
      - name: All test suites
        shell: bash
        run: |
          case "$GITHUB_REF_NAME" in
            cli-kit-v*|delva-tools-v*) ./gradlew check --console=plain;;
            *) ./gradlew check heapCappedTest crashTest --console=plain;;
          esac

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-test-reports-${{ matrix.os }}
          path: '**/build/reports/tests/'

  # The plugin against the lowest IDE it supports and the newest EAP, as in CI.
  verify-plugin:
    if: startsWith(github.ref_name, 'delva-tools-v')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      # The IDEs don't fit in the runner's free disk space beside what it comes with.
      - name: Free disk space
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-build
        with:
          cache-disabled: true

      - name: Verify the IntelliJ plugin
        run: ./gradlew :delva-intellij-plugin:verifyPlugin --console=plain

      - name: Upload Plugin Verifier reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-plugin-verifier-reports
          path: delva-intellij-plugin/build/reports/pluginVerifier

  # The plugin's ZIP installed in the IDE it builds against and driven through its UI, as in CI.
  plugin-integration-test:
    if: startsWith(github.ref_name, 'delva-tools-v')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Free disk space
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-build
        with:
          cache-disabled: true

      - name: Run the IntelliJ plugin's integration test
        run: xvfb-run --auto-servernum ./gradlew :delva-intellij-plugin:integrationTest --console=plain

      - name: Upload the IDE's logs
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-plugin-integration-test-logs
          path: |
            out/ide-tests/tests/*/*/log/
            delva-intellij-plugin/build/reports/tests/integrationTest/

  release:
    needs: [test, verify-plugin, plugin-integration-test]
    # The plugin's jobs run only for a Delva Tools tag. A skipped job would skip this one too, so the condition names
    # what each train needs.
    if: >-
      ${{ !cancelled() && needs.test.result == 'success' &&
      (!startsWith(github.ref_name, 'delva-tools-v') ||
      (needs.verify-plugin.result == 'success' && needs.plugin-integration-test.result == 'success')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Holds the signing keys and the Portal and Marketplace tokens; give it a required reviewer so a release waits for
    # approval.
    environment: release
    permissions:
      contents: write # draft the GitHub release
      id-token: write # sign the provenance attestation
      attestations: write # store it
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-build
        with:
          cache-disabled: true

      # Everything that can fail without building fails here, before anything is uploaded: a deployment left half done
      # in the Portal, or a release once published, can't simply be undone.
      - name: Check the tag matches the version, and extract the release notes
        run: |
          # The tag's prefix names the train, as build-logic/src/main/kotlin/ReleaseTrain.kt defines them; Delva Tools
          # isn't on Maven Central, so it has no stage task.
          case "$GITHUB_REF_NAME" in
            cli-kit-v*) train=cli-kit title=cli-kit property=clikit.version prefix=cli-kit-v
              changelog=cli-kit/CHANGELOG.md stage=stageCliKit;;
            delva-tools-v*) train=delva-tools title="Delva Tools" property=delvaTools.version prefix=delva-tools-v
              changelog=delva-intellij-plugin/CHANGELOG.md stage=;;
            *) train=delva title=Delva property=delva.version prefix=v changelog=CHANGELOG.md stage=stageDelva;;
          esac
          version=$(awk -F= -v p="$property" '$1 == p { print $2 }' gradle.properties)
          if [ "$prefix$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match $property=$version in gradle.properties"
            exit 1
          fi
          case "$version" in *-SNAPSHOT) echo "::error::Snapshots aren't released"; exit 1;; esac
          {
            echo "TRAIN=$train"
            echo "TITLE=$title"
            echo "VERSION=$version"
            echo "STAGE_TASK=$stage"
            echo "STAGING=build/staging-repository/$train"
          } >> "$GITHUB_ENV"
          # The notes are the version's section of the train's changelog, without its heading or the link references
          # after it.
          awk -v v="$version" '
            index($0, "## [" v "]") == 1 { found = 1; next }
            found && (/^## \[/ || /^\[[^]]+\]: /) { exit }
            found { print }
          ' "$changelog" > "$RUNNER_TEMP/release-notes.md"
          if ! grep -q '[^[:space:]]' "$RUNNER_TEMP/release-notes.md"; then
            echo "::error::$changelog has no section for $version"
            exit 1
          fi

      - name: Build the signed bundle
        if: env.TRAIN != 'delva-tools'
        env:
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          ./gradlew "$STAGE_TASK" --console=plain
          # Every file the Portal gets must be signed; an unsigned bundle means the key wasn't configured.
          unsigned=$(find "$STAGING" \( -name '*.jar' -o -name '*.pom' -o -name '*.module' \) \
            -exec sh -c '[ -f "$1.asc" ] || echo "$1"' _ {} \;)
          if [ -n "$unsigned" ]; then
            echo "::error::Unsigned files: $unsigned"
            exit 1
          fi
          (cd "$STAGING" && zip -qr "$GITHUB_WORKSPACE/build/$TRAIN-bundle.zip" .)

      # The command line rides the Delva train, and ships as archives on the GitHub release, not on Maven Central.
      - name: Build the command-line distribution
        if: env.TRAIN == 'delva'
        run: |
          ./gradlew :delva-cli:distZip :delva-cli:distTar --console=plain
          cd delva-cli/build/distributions
          # The start scripts, the jars, the licences and the README; anything else riding along is a mistake.
          unexpected=$(unzip -Z1 "delva-cli-$VERSION.zip" \
            | grep -vE "^delva-cli-$VERSION/(bin/(delva|delva\.bat)?|lib/([^/]+\.jar)?|LICENSE|NOTICE|README\.txt)?$" || true)
          if [ -n "$unexpected" ]; then
            echo "::error::Unexpected files in the distribution: $unexpected"
            exit 1
          fi
          sha256sum "delva-cli-$VERSION.zip" "delva-cli-$VERSION.tar" > SHA256SUMS

      # The plugin ships as one ZIP, signed with the plugin key; Marketplace signs it again with JetBrains' own.
      # verifyPluginSignature fails when there's no signed ZIP, which is what signPlugin leaves without the key.
      - name: Build the signed plugin
        if: env.TRAIN == 'delva-tools'
        env:
          CERTIFICATE_CHAIN: ${{ secrets.PLUGIN_CERTIFICATE_CHAIN }}
          PRIVATE_KEY: ${{ secrets.PLUGIN_PRIVATE_KEY }}
          PRIVATE_KEY_PASSWORD: ${{ secrets.PLUGIN_PRIVATE_KEY_PASSWORD }}
        run: |
          ./gradlew :delva-intellij-plugin:checkPluginDistribution :delva-intellij-plugin:verifyPluginSignature \
            --console=plain
          cd delva-intellij-plugin/build/distributions
          sha256sum "delva-intellij-plugin-$VERSION-signed.zip" > SHA256SUMS

      - name: Attest build provenance
        if: env.TRAIN != 'delva-tools'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            ${{ env.STAGING }}/**/*.jar
            ${{ env.STAGING }}/**/*.pom
            ${{ env.STAGING }}/**/*.module

      - name: Attest the command-line distribution's provenance
        if: env.TRAIN == 'delva'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            delva-cli/build/distributions/delva-cli-*.zip
            delva-cli/build/distributions/delva-cli-*.tar

      - name: Attest the plugin's provenance
        if: env.TRAIN == 'delva-tools'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: delva-intellij-plugin/build/distributions/delva-intellij-plugin-*-signed.zip

      # USER_MANAGED: the Portal validates the deployment and waits for it to be released by hand. The upload returns as
      # soon as the bundle lands and validation runs after it, so this step waits for the verdict: a deployment the
      # Portal rejects gets no draft release and no KDoc.
      - name: Upload to the Central Portal and wait for its validation
        if: env.TRAIN != 'delva-tools'
        env:
          CENTRAL_TOKEN: ${{ secrets.CENTRAL_TOKEN }}
        run: |
          id=$(curl --fail-with-body --silent --show-error --request POST \
            --header "Authorization: Bearer $CENTRAL_TOKEN" \
            --form bundle=@"build/$TRAIN-bundle.zip" \
            "https://central.sonatype.com/api/v1/publisher/upload?publishingType=USER_MANAGED&name=$TRAIN-$VERSION")
          if ! [[ $id =~ ^[0-9a-f-]{36}$ ]]; then
            echo "::error::The Portal answered the upload with no deployment id: $id"
            exit 1
          fi
          # The id is what dropping the deployment needs, if it never gets published.
          echo "Central Portal deployment: \`$id\`" >> "$GITHUB_STEP_SUMMARY"
          # Up to 20 minutes, every 20 seconds; a status request that fails transiently is retried, not fatal.
          for _ in $(seq 60); do
            status=$(curl --fail-with-body --silent --show-error --retry 3 --request POST \
              --header "Authorization: Bearer $CENTRAL_TOKEN" \
              "https://central.sonatype.com/api/v1/publisher/status?id=$id")
            state=$(jq -r .deploymentState <<< "$status")
            case "$state" in
              VALIDATED|PUBLISHING|PUBLISHED)
                echo "Deployment $id: $state"
                exit 0;;
              FAILED)
                echo "::error::The Central Portal rejected deployment $id"
                jq .errors <<< "$status"
                exit 1;;
            esac
            sleep 20
          done
          echo "::error::Deployment $id was still $state after 20 minutes"
          exit 1

      # Hidden, as the build script sets: Marketplace reviews the version, and it stays hidden after approval until
      # it is unhidden by hand. Only a version already on Marketplace can be uploaded; the first is uploaded on the
      # Marketplace site. A release candidate is never uploaded.
      - name: Upload to JetBrains Marketplace, hidden
        if: env.TRAIN == 'delva-tools'
        env:
          PUBLISH_TOKEN: ${{ secrets.PLUGIN_PUBLISH_TOKEN }}
          CERTIFICATE_CHAIN: ${{ secrets.PLUGIN_CERTIFICATE_CHAIN }}
          PRIVATE_KEY: ${{ secrets.PLUGIN_PRIVATE_KEY }}
          PRIVATE_KEY_PASSWORD: ${{ secrets.PLUGIN_PRIVATE_KEY_PASSWORD }}
        run: |
          case "$VERSION" in
            *-*)
              echo "Release candidate: not uploaded to JetBrains Marketplace." >> "$GITHUB_STEP_SUMMARY"
              exit 0;;
          esac
          id=$(grep -m1 -oP '(?<=<id>)[^<]+' delva-intellij-plugin/src/main/resources/META-INF/plugin.xml)
          status=$(curl --silent --show-error --retry 3 --output /dev/null --write-out '%{http_code}' \
            --header "Authorization: Bearer $PUBLISH_TOKEN" "https://plugins.jetbrains.com/api/plugins/intellij/$id")
          case "$status" in
            200) ;;
            404)
              echo "::warning::$id isn't on JetBrains Marketplace yet; upload the signed ZIP on the Marketplace site"
              echo "\`$id\` isn't on JetBrains Marketplace yet: upload the release's signed ZIP by hand." \
                >> "$GITHUB_STEP_SUMMARY"
              exit 0;;
            *)
              echo "::error::JetBrains Marketplace answered $status for $id"
              exit 1;;
          esac
          ./gradlew :delva-intellij-plugin:publishPlugin --console=plain
          # What Marketplace got is the ZIP that was attested and goes on the release.
          (cd delva-intellij-plugin/build/distributions && sha256sum --check SHA256SUMS)
          echo "Uploaded \`$id\` $VERSION to JetBrains Marketplace, hidden." >> "$GITHUB_STEP_SUMMARY"

      - name: Draft the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A version with a hyphen, such as 0.1.0-rc.1, is a pre-release, so it never becomes the latest release.
          prerelease=()
          case "$VERSION" in *-*) prerelease=(--prerelease);; esac
          # The train's jars, and for Delva the command line's archives; for Delva Tools the signed plugin ZIP.
          case "$TRAIN" in
            delva-tools)
              distributions=delva-intellij-plugin/build/distributions
              assets=("$distributions/delva-intellij-plugin-$VERSION-signed.zip" "$distributions/SHA256SUMS");;
            *)
              mapfile -t assets < <(find "$STAGING" -name '*.jar' | sort)
              if [ "$TRAIN" = delva ]; then
                distributions=delva-cli/build/distributions
                assets+=("$distributions/delva-cli-$VERSION.zip" "$distributions/delva-cli-$VERSION.tar" \
                  "$distributions/SHA256SUMS")
              fi;;
          esac
          gh release create "$GITHUB_REF_NAME" --draft --verify-tag "${prerelease[@]}" \
            --title "$TITLE $VERSION" --notes-file "$RUNNER_TEMP/release-notes.md" "${assets[@]}"

  # Delva's KDoc on GitHub Pages. The cli-kit train and pre-releases (any tag with a hyphen, such as -rc.1) are skipped,
  # so the site always shows the newest Delva release. A Delva release skips the plugin's jobs, and a job whose
  # condition doesn't name the result it waits for is skipped after any skipped job before it.
  pages:
    needs: release
    if: >-
      ${{ !cancelled() && needs.release.result == 'success' &&
      startsWith(github.ref_name, 'v') && !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    permissions:
      pages: write # deploy the site
      id-token: write # prove the deployment comes from this workflow
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-build
        with:
          cache-disabled: true

      - name: Render the KDoc
        run: ./gradlew :delva:dokkaGeneratePublicationHtml --console=plain

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: delva/build/dokka/html

      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
