name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to a pull request cancels the run it supersedes; runs on main always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-build

      - name: Check
        run: ./gradlew check --console=plain

      # `check` doesn't build the published artifacts; building them here catches a broken POM, KDoc, signing setup
      # or command-line archive before release time.
      - name: Publication
        if: matrix.os == 'ubuntu-latest'
        run: >-
          ./gradlew :delva:publishMavenPublicationToStagingRepository
          :delva-kotlinx-serialization:publishMavenPublicationToStagingRepository
          :cli-kit:publishAllPublicationsToStagingRepository :cli-kit-testing:publishAllPublicationsToStagingRepository
          :delva-cli:distZip :delva-cli:distTar --console=plain

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports-${{ matrix.os }}
          path: '**/build/reports/tests/'

      # The basic cache provider saves the Gradle User Home without stopping the daemon first, and on Windows the
      # running daemon's lock files can't be read, so the save fails.
      - name: Stop Gradle
        if: ${{ !cancelled() }}
        run: ./gradlew --stop
