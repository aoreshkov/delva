name: Dependency submission

# GitHub doesn't read Gradle builds by itself: this submits the resolved dependency graph, which is what the
# dependency graph, Dependabot alerts and dependency review see.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  submit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write # the dependency submission API
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: corretto
          java-version: 25

      - uses: gradle/actions/dependency-submission@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-provider: basic
          # The cache key depends only on the build files, so this job's entry would take the key CI's fuller entry
          # needs; it reads CI's instead.
          cache-read-only: true
          dependency-graph: generate-and-submit
          # Only what runs: the library's, the command line's, the IntelliJ plugin's, the tests' and the benchmarks'
          # runtime classpaths. The build's own tooling (plugin classpaths, Dokka's generator, the Kotlin plugin's
          # internal configurations and build-logic, whose runtime classpath is plugins) stays out. Its transitive
          # libraries can't be updated from here, so their alerts could only be dismissed and their security updates
          # only fail; upgrading the plugins is what fixes them, and Dependabot's version updates do that. The IDEs the
          # IntelliJ plugin builds and runs its tests in stay out too: they aren't Maven dependencies, and the IDE
          # brings its own libraries. So does the plugin's integration test, whose classpath is JetBrains' Starter and
          # what it brings, and the empty testUi source set the IntelliJ Platform plugin adds beside it with the same
          # classpath.
          dependency-graph-exclude-projects: ':build-logic'
          dependency-graph-include-configurations: '.*[Rr]untimeClasspath'
          dependency-graph-exclude-configurations: 'intellijPlatform.*|integrationTest.*|testUi.*'
