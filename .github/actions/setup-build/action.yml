name: Set up the build
description: JDK 25 and Gradle, with the Gradle wrapper validated.

inputs:
  cache-disabled:
    description: "'true' builds without the Gradle cache, as a release does."
    default: 'false'
  cache-read-only:
    description: >-
      'true' reads the Gradle cache but never saves it, for a job whose downloads shouldn't fill it. The default is
      setup-gradle's own: read-only except on the default branch.
    default: ${{ github.event.repository != null && github.ref_name != github.event.repository.default_branch }}

runs:
  using: composite
  steps:
    - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
      with:
        distribution: corretto
        java-version: 25

    # The 'basic' cache is the open-source one on the GitHub Actions cache; the default 'enhanced' one is a proprietary
    # component under separate terms of use.
    - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      with:
        cache-provider: basic
        cache-disabled: ${{ inputs.cache-disabled }}
        cache-read-only: ${{ inputs.cache-read-only }}
