kotlin.code.style=official
# The IntelliJ Platform settings plugin drops the Kotlin standard library from every project of a build that doesn't
# set this, so it is set here for the modules that need it; delva-intellij-plugin's gradle.properties turns it off.
kotlin.stdlib.default.dependency=true
org.gradle.jvmargs=-Xmx4096M -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.configuration-cache=true

# One version per release train; build-logic/src/main/kotlin/ReleaseTrain.kt says which module rides which.
delva.version=0.4.0-SNAPSHOT
clikit.version=0.4.0-SNAPSHOT
# Delva Tools, the IntelliJ plugin in delva-intellij-plugin, is released to JetBrains Marketplace, not Maven Central.
# Its minor is that of the Delva release it bundles: 0.2.x reads stores of Delva 0.2.
delvaTools.version=0.2.1-SNAPSHOT
